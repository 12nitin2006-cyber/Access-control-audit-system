<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Access simulation</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;color:#172033}main{max-width:650px;margin:30px auto;padding:0 18px}.panel{background:white;padding:24px;border-radius:12px}
label{display:block;margin-top:14px;font-weight:bold}select{width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:7px}button{margin-top:20px;padding:12px 18px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.result{padding:14px;border-radius:8px;margin-top:18px;font-weight:bold}.granted{background:#dcfce7;color:#166534}.denied{background:#fee2e2;color:#991b1b}
</style></head><body><main><a href="{{ url_for('dashboard') }}">← Dashboard</a><h1>Access simulation</h1><section class="panel">
<p>Select a user, resource and action to test whether access should be allowed.</p>
<form method="POST" action="{{ url_for('simulate') }}">
<label for="user">User</label><select id="user" name="user" required><option value="">Choose user</option>{% for u in users %}<option value="{{ u.id }}">{{ u.full_name }} (ID {{ u.id }})</option>{% endfor %}</select>
<label for="resource">Resource</label><select id="resource" name="resource" required><option value="">Choose resource</option>{% for r in resources %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}</select>
<label for="action">Action</label><select id="action" name="action" required><option value="read">Read</option><option value="write">Write</option><option value="update">Update</option><option value="delete">Delete</option></select>
<button type="submit">Check access</button></form>
{% if result %}<div class="result {{ 'granted' if result=='granted' else 'denied' }}">Access {{ result|upper }}</div>{% endif %}
</section></main></body></html>
